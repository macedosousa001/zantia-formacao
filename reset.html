<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><title>Reset · Zantia</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}body{background:linear-gradient(135deg,#1A365D,#0F1F36);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:28px;max-width:460px;width:100%}.logo{width:50px;height:50px;background:#D92525;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-weight:900;font-size:28px}h1{font-size:22px;font-weight:900;margin-bottom:8px}.sub{color:#FCA5A5;font-size:12px;font-weight:700;letter-spacing:3px;margin-bottom:20px}p{font-size:14px;line-height:1.6;margin-bottom:12px;opacity:0.92}button{width:100%;background:#D92525;color:#fff;border:0;padding:14px;border-radius:6px;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px}#log{font-family:monospace;font-size:11px;background:rgba(0,0,0,0.4);border-radius:4px;padding:10px;margin-top:14px;max-height:200px;overflow-y:auto}.ok{color:#10B981}</style><link rel="manifest" href="/zantia-formacao/manifest.webmanifest"><meta name="theme-color" content="#D92525"><link rel="apple-touch-icon" href="/zantia-formacao/assets/assets/images/icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zantia"><meta name="mobile-web-app-capable" content="yes"><script>(function(){if(!("serviceWorker" in navigator))return;navigator.serviceWorker.addEventListener("message",function(e){if(e.data&&(e.data.type==="SW_KILLED"||e.data.type==="SW_UPDATED")){setTimeout(function(){location.reload()},150)}});navigator.serviceWorker.getRegistrations().then(async function(rs){if(rs.length===0)return;var hadCtrl=!!navigator.serviceWorker.controller;for(var i=0;i<rs.length;i++){try{await rs[i].unregister()}catch(_){}}if("caches" in window){try{var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}))}catch(_){}}if(hadCtrl){setTimeout(function(){location.reload()},250)}}).catch(function(){})})();</script></head><body><div class="card"><div class="logo">Z</div><h1>ZANTIA · RESET</h1><div class="sub">LIMPEZA TOTAL</div><p>Clica no botão para apagar todo o cache local e voltar a app limpa.</p><button id="btn">Limpar tudo</button><div id="log"></div></div><script>const log=(m,c)=>{const e=document.getElementById('log'),l=document.createElement('div');if(c)l.className=c;l.textContent=m;e.appendChild(l)};document.getElementById('btn').onclick=async()=>{const b=document.getElementById('btn');b.disabled=true;b.textContent='A limpar...';try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs){await r.unregister();log('✓ SW removido','ok')}}if('caches' in window){const ks=await caches.keys();for(const k of ks){await caches.delete(k);log('✓ Cache: '+k,'ok')}}try{localStorage.clear();log('✓ localStorage limpo','ok')}catch{}try{sessionStorage.clear();log('✓ sessionStorage limpo','ok')}catch{}log('✓ Redireciona em 1.5s','ok');setTimeout(()=>location.replace('/zantia-formacao/?fresh='+Date.now()),1500)}catch(e){log('✗ '+e.message)}}</script></body></html>
